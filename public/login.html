<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar - CineList</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <a href="index.html" class="header__logo text-decoration-none">
        <span class="header__logo-icon">&#127916;</span> CineList
    </a>
    <nav class="header__nav" id="headerNav">
        <a href="index.html#inicio" class="header__nav-link">Início</a>
        <a href="index.html#catalogo" class="header__nav-link">Catálogo</a>
        <a href="index.html#aluno" class="header__nav-link">Sobre</a>
        <span class="header__dinamico" id="menuDinamico"></span>
    </nav>
    <button class="header__menu-toggle" id="menuToggle" aria-label="Abrir menu">&#9776;</button>
</header>

<main class="main container-fluid py-4 py-md-5">
    <div class="auth">
        <div class="row g-4 justify-content-center">

            <!-- Tela 2 - Login -->
            <div class="col-12 col-md-7 col-lg-5">
                <div class="auth__card">
                    <h2 class="auth__titulo">Login</h2>
                    <p class="auth__sub">Acesse sua conta para favoritar títulos.</p>

                    <form id="formLogin" class="form-auth" novalidate>
                        <div class="mb-3">
                            <label for="loginUsuario" class="form-label">Login</label>
                            <input type="text" class="form-control" id="loginUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginSenha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="loginSenha" required>
                        </div>
                        <p id="loginMsg" class="form-auth__msg"></p>
                        <button type="submit" class="btn auth__btn w-100">Entrar</button>
                    </form>

                    <p class="auth__troca">
                        Ainda não tem conta?
                        <a href="cadastro-usuario.html" class="auth__troca-link">Cadastre-se</a>
                    </p>

                    <p class="auth__dica">
                        Teste: <strong>admin / 123</strong> (administrador) ou <strong>user / 123</strong> (comum).
                    </p>
                </div>
            </div>

        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer__content">
        <div class="footer__info">
            <p class="footer__text">&copy; 2026 CineList - Organize seus filmes e séries favoritos</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/scripts/app.js"></script>
<script src="assets/scripts/login.js"></script>
</body>
</html>
