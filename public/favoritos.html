<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meus Favoritos - CineList</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <a href="index.html" class="header__logo text-decoration-none">
        <span class="header__logo-icon">&#127916;</span> CineList
    </a>
    <nav class="header__nav" id="headerNav">
        <a href="index.html#inicio" class="header__nav-link">Início</a>
        <a href="index.html#catalogo" class="header__nav-link">Catálogo</a>
        <a href="index.html#aluno" class="header__nav-link">Sobre</a>
        <span class="header__dinamico" id="menuDinamico"></span>
    </nav>
    <button class="header__menu-toggle" id="menuToggle" aria-label="Abrir menu">&#9776;</button>
</header>

<main class="main container-fluid py-4 py-md-5">
    <section class="favoritos">
        <div class="favoritos__cabecalho">
            <h2 class="secao__titulo mb-0">Meus Favoritos</h2>
            <span class="favoritos__contador" id="favoritosContador"></span>
        </div>

        <div id="favoritosGrid">
            <div class="text-center py-5">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="footer__content">
        <div class="footer__info">
            <p class="footer__text">&copy; 2026 CineList - Organize seus filmes e séries favoritos</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/scripts/app.js"></script>
</body>
</html>
